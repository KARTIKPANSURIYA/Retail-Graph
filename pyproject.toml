[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retailgraph"
version = "0.1.0"
description = "Research foundations for anonymous retail attention and interaction benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "RetailGraph contributors"}]
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9,<5"]
ml = ["torch>=2.2,<3"]
dev = ["mypy>=1.10,<2", "pytest>=8,<9", "ruff>=0.6,<1", "types-PyYAML>=6"]

[project.scripts]
retailgraph = "retailgraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/retailgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["retailgraph"]
